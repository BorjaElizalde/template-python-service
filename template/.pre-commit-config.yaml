# The commit hooks. The python-service template writes and updates this header and the first hook,
# template-hooks, which runs the template's hooks from pre-commit.base.yaml. The project's own hooks
# go after it.
repos:
  - repo: local
    hooks:
      - id: template-hooks
        name: template hooks (pre-commit.base.yaml)
        entry: uv run pre-commit run --config pre-commit.base.yaml --files
        language: system
        # Else pre-commit splits the files across parallel runs, and each runs every template hook.
        require_serial: true
