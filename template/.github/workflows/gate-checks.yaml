# From the python-service template: change the template, not this copy.
# The checks a project's CI runs, one step per tool, never through make gate. The Gate workflow
# calls it on every PR into develop or staging, with skip true on a draft and on the promotion of
# develop. Each tool reads only CI's settings, the files in .github/gate-checks/, so no edit
# outside .github can relax CI. Coverage alone reads the project's settings: CI sets no coverage
# floor, so they can only add one.
name: Gate

on:
  workflow_call:
    inputs:
      skip:
        type: boolean
        required: true

jobs:
  checks:
    if: ${{ !inputs.skip }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A step that names no shell runs bash without -o pipefail.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-groups
      # Else ruff skips a committed file that a .gitignore or .ignore lists.
      - name: Lint with ruff
        run: uv run ruff check --config .github/gate-checks/ruff.base.toml --no-respect-gitignore .
      - name: Check the format with ruff
        run: |
          uv run ruff format --check --config .github/gate-checks/ruff.base.toml \
            --no-respect-gitignore .
      # basedpyright resolves the paths in its settings from their file's folder, so CI's copy goes
      # to the root. No file is at the baseline path: a project's .basedpyright/baseline.json would
      # hide each error it lists.
      - name: Check types with basedpyright
        run: |
          cp .github/gate-checks/basedpyright.base.json .basedpyright-ci.json
          uv run basedpyright --project .basedpyright-ci.json \
            --baselinefile "$RUNNER_TEMP/no-baseline.json"
      # With --ini, bandit never looks for a project's .bandit.
      - name: Scan for security issues with bandit
        run: uv run bandit -r . -x ./.venv -ll -ii --ini .github/gate-checks/bandit.ini
      # Each Python file git tracks, named: in a folder it walks, jscpd skips a file that a
      # .gitignore or .ignore lists. As in python.mk, a failure prints the fix order
      # .claude/rules/python-conventions.md gives.
      - name: Find duplicated code with jscpd
        run: |
          files=()
          while IFS= read -r -d '' file; do files+=("$file"); done < <(git ls-files -z -- '*.py')
          uv run jscpd --config .github/gate-checks/.jscpd.json "${files[@]}" || {
            echo "::error::For each copy jscpd lists: delete the copy that should not exist first;" \
              "else call the code's existing owner; extract a shared function only last. A copy" \
              "that must stay goes between # jscpd:ignore-start and # jscpd:ignore-end, with its" \
              "reason (.claude/rules/skipped-checks.md). No jscpd? uv add --dev jscpd"
            exit 1
          }
      # As in python.mk: no tests/ skips pytest, an empty tests/ fails it. With -c, pytest would
      # take .github/gate-checks/ as its root: --rootdir keeps the repository's, and python -m puts
      # the repository on the import path, which pyproject.toml's pythonpath does for make gate.
      - name: Run tests with pytest
        run: |
          if [ ! -d tests ]; then
            echo "::notice::pytest skipped: no tests/ folder"
            exit 0
          fi
          uv run python -m pytest -c .github/gate-checks/pytest.ini --rootdir . tests --cov
