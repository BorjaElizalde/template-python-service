# This repository's own CI checks, which the Gate workflow from template-agentic runs. A template
# repository's CI may run make gate: the rule that CI never runs it is for projects' CI.
name: Template checks
description: Renders the templates and runs every rendered suite through make gate
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
    - run: make gate
      shell: bash
