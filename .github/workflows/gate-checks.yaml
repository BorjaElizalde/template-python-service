# This repository's own CI checks, which the Gate workflow from template-agentic and Build call. A
# template repository's CI may run make gate: the rule that CI never runs it is for projects' CI.
name: Template checks

on:
  workflow_call:
    inputs:
      skip:
        type: boolean
        required: true

jobs:
  checks:
    if: ${{ !inputs.skip }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: make gate
