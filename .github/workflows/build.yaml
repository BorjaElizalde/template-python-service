name: Build

on:
  push:
    branches: [main]

# Serialized so two merges on one day count each other's tags.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: make gate

  # YYYYMMDD.N from the commit date: Copier and Renovate order template versions by PEP 440, which
  # the YYYYMMDD-shortsha image tags do not satisfy.
  version-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version_tag: ${{ steps.generate.outputs.version_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - id: generate
        run: |
          date=$(TZ=UTC git show -s --format=%cd --date=format-local:%Y%m%d HEAD)
          n=$(git ls-remote --tags --refs origin | awk -v p="refs/tags/$date." 'index($2, p) == 1' | wc -l)
          echo "version_tag=$date.$((n + 1))" >> "$GITHUB_OUTPUT"

  publish-template:
    needs: [gate, version-tag]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - env:
          VERSION_TAG: ${{ needs.version-tag.outputs.version_tag }}
        run: |
          git tag "$VERSION_TAG"
          git push origin "$VERSION_TAG"
