# template-agentic's settings and questions, which a release tag bundles and no branch holds.
# Copier joins the two documents' _exclude, _jinja_extensions, _secret_questions and
# _skip_if_exists lists; for any other setting or question both name, this one wins.
!include agentic/copier.yaml
---
_subdirectory: template
_answers_file: .copier-answers.python-service.yaml

# Seeded once, then project-owned: updates skip them, and a first copy keeps an existing file.
_skip_if_exists:
  - .gitignore
  - Makefile
  - pyproject.toml

# A copy gets the rule folder of each part it picks. Copier renders each pattern with the answers,
# and a pattern that renders empty excludes nothing.
_exclude:
  - "{% if 'api' not in parts %}.claude/rules/api{% endif %}"
  - "{% if 'batch' not in parts %}.claude/rules/batch{% endif %}"
  - "{% if 'database' not in parts %}.claude/rules/database{% endif %}"

package_name:
  type: str
  help: The application's Python package directory (e.g. app)
  # Copier reads the !include a branch lacks as empty, so the first clause stops a copy of a branch.
  # _copier_answers holds only answers to questions, so a branch's --data issues_repo is not in it.
  validator: >-
    {% if 'issues_repo' not in _copier_answers %}Copy a release tag: a branch holds no template-agentic, which a release bundles{% elif not package_name or package_name | lower != package_name or ' ' in package_name or '/' in package_name %}Give the package directory as a lowercase Python identifier{% endif %}

parts:
  type: str
  help: The parts the project has, beyond the Python layer every project gets (a research lab picks none)
  multiselect: true
  choices:
    An API, with FastAPI and MCP tools: api
    Batch tasks and their CLI: batch
    A database, with SQLAlchemy and Alembic migrations: database
  # Every part, so an update gives a project copied before this question every part it had.
  default: [api, batch, database]

test_boundaries:
  type: yaml
  help: Calls that also count as a test boundary, beyond those of the parts picked (e.g. a release step's entry point, as module.function)
  default: []
  validator: >-
    {% if test_boundaries is string %}Give a list of calls{% endif %}
