_min_copier_version: "9.14.0"
_subdirectory: template
_answers_file: .copier-answers.python-service.yaml

# A complement of template-agentic: it fills the agentic layer's plug-in points, so that layer's
# answers must already be in the project.
_external_data:
  agentic: .copier-answers.agentic.yaml

# Seeded once, then project-owned: updates skip them, and a first copy keeps an existing file.
_skip_if_exists:
  - .gitignore
  - Makefile
  - pyproject.toml

package_name:
  type: str
  help: The application's Python package directory (e.g. app)
  validator: >-
    {% if not _external_data.agentic %}Apply template-agentic first: .copier-answers.agentic.yaml is missing{% elif not package_name or package_name | lower != package_name or ' ' in package_name or '/' in package_name %}Give the package directory as a lowercase Python identifier{% endif %}

test_boundaries:
  type: yaml
  help: Calls that also count as a test boundary, beyond endpoints, MCP tools, batch tasks and the CLI (e.g. a release step's entry point, as module.function)
  default: []
  validator: >-
    {% if test_boundaries is string %}Give a list of calls{% endif %}
